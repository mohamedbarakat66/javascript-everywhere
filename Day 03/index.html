<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 03 - Student Grade App</title>
    
</head>
<body>

    <div class="container">
        <h2>Student Grade Tracker</h2>
        
        <div>
            <input type="text" id="nameInput" placeholder="Student Name">
            <input type="number" id="scoreInput" placeholder="Score">
            <button id="addButton">Add</button>
            <button id="clearButton">Clear</button>
        </div>
        <div id="errorMsg" class="error"></div>

        <h3>Students List:</h3>
        <ul id="studentsList"></ul>

        <div id="summaryDiv" class="summary"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
