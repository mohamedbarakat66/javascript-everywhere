<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard</title>
</head>
<body>

  <h2>Student Dashboard</h2>

  <input id="nameInput" placeholder="Student Name">
  <input id="scoreInput" type="number" placeholder="Score">
  <input id="cityInput" placeholder="City (Optional)">

  <p id="errorMsg"></p>

  <div>
    <button id="addBtn">Add Student</button>
    <button id="loadBtn">Load from Server</button>
    <button id="clearBtn">Clear All</button>
    <button id="freezeBtn">Freeze (blockFor 3000ms)</button>
    <button id="chunkBtn">Chunked (Smooth)</button>
  </div>

  <h3>Students List</h3>
  <ul id="studentList"></ul>

  <p id="summaryDiv"></p>

  <script src="app.js"></script>

</body>
</html>
